<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32" href="/favicon.ico?v=20261018-r1" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=20261018-r1" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=20261018-r1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf7ef" />
    <script>
      // Apply the saved appearance before the first paint and the React bundle.
      (() => {
        let theme = 'light'
        try { if (localStorage.getItem('portfolio:theme') === 'dark') theme = 'dark' } catch {}
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#1e3a52' : '#fbf7ef'
      })()
    </script>
    <meta name="description" content="Re:代码生活——记录项目、学习与每一次进步。" />
    <title>Re:代码生活</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
